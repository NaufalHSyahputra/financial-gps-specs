<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Add Transaction - Screen 7</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appDark: '#1E232A',
            appGrayBorder: '#E5E7EB',
            appMutedText: '#9CA3AF',
            appTextPrimary: '#111827',
            appInputBg: '#FFFFFF',
            appTabBg: '#F3F4F6'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-overrides">
    /* Remove native select arrow styling to maintain custom SVG chevron appearance */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: none !important;
    }
    /* iOS smooth scrolling and tap highlight suppression */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] flex justify-center items-center min-h-screen text-appTextPrimary font-sans antialiased p-0 sm:p-4">
<!-- BEGIN: PhoneContainer -->
<!-- Container mimicking an iOS device / modal layout matching Screen 7 -->
<main class="w-full max-w-sm bg-white min-h-screen sm:min-h-[812px] sm:max-h-[844px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-gray-100" data-purpose="mobile-screen-container">
<!-- Top Content Area -->
<div class="flex-1 flex flex-col">
<!-- BEGIN: StatusBar -->
<!-- iOS standard header status indicators -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-xs font-semibold select-none" data-purpose="ios-status-bar">
<span class="tracking-tight text-[13px] font-bold">9:41</span>
<div class="flex items-center space-x-1.5 text-black">
<!-- Cellular Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-5h3v17h-3V4z"></path>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A17.88 17.88 0 0 0 12 4z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-current rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<!-- Screen modal title and close button -->
<nav class="relative flex items-center justify-center px-4 py-3 border-b border-transparent" data-purpose="screen-navigation">
<button aria-label="Close" class="absolute left-5 p-1 text-gray-800 hover:text-gray-500 transition-colors focus:outline-none" type="button">
<!-- 'X' Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
<h1 class="text-base font-bold text-gray-900 tracking-tight">Add Transaction</h1>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: TransactionForm -->
<form class="px-5 pt-3 pb-6 flex-1 flex flex-col justify-between" data-purpose="transaction-entry-form" id="add-transaction-form" onsubmit="event.preventDefault();">
<div class="space-y-4">
<!-- BEGIN: TransactionTypeTabs -->
<!-- Segmented tab switch for Expense, Income, and Transfer -->
<div class="grid grid-cols-3 p-1 bg-gray-100/90 rounded-xl gap-1" data-purpose="type-segmented-control">
<button class="py-2 text-xs font-semibold rounded-lg bg-appDark text-white shadow-sm transition-all focus:outline-none" data-type="expense" type="button">
              Expense
            </button>
<button class="py-2 text-xs font-medium rounded-lg text-gray-600 hover:text-gray-900 transition-all focus:outline-none" data-type="income" type="button">
              Income
            </button>
<button class="py-2 text-xs font-medium rounded-lg text-gray-600 hover:text-gray-900 transition-all focus:outline-none" data-type="transfer" type="button">
              Transfer
            </button>
</div>
<!-- END: TransactionTypeTabs -->
<!-- BEGIN: AmountSection -->
<!-- Main display of currency and current value -->
<div class="pt-1 pb-1" data-purpose="amount-input-display">
<label class="block text-xs font-medium text-gray-500 mb-1.5">Amount</label>
<div class="flex items-center justify-between border-b border-gray-100 pb-2">
<div class="flex items-baseline space-x-1.5">
<span class="text-lg font-bold text-gray-900">Rp</span>
<span class="text-2xl font-bold text-gray-400 tracking-tight flex items-center">
                  0
                  <!-- Blinking cursor effect -->
<span class="inline-block w-[1.5px] h-6 bg-blue-600 ml-0.5 animate-pulse"></span>
</span>
</div>
<button aria-label="Calculator" class="text-gray-400 hover:text-gray-600 p-1" type="button">
<!-- Calculator / keypad icon -->
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="20" rx="3" ry="3" width="16" x="4" y="2"></rect>
<line x1="8" x2="16" y1="6" y2="6"></line>
<circle cx="8" cy="11" r="1"></circle>
<circle cx="12" cy="11" r="1"></circle>
<circle cx="16" cy="11" r="1"></circle>
<circle cx="8" cy="15" r="1"></circle>
<circle cx="12" cy="15" r="1"></circle>
<circle cx="16" cy="15" r="1"></circle>
</svg>
</button>
</div>
</div>
<!-- END: AmountSection -->
<!-- BEGIN: FormFields -->
<div class="space-y-3 pt-1" data-purpose="transaction-detail-fields">
<!-- Field: Date -->
<div>
<div class="flex items-center justify-between border border-gray-200 rounded-xl px-3.5 py-2.5 bg-white">
<label class="text-xs text-gray-500 font-medium">Date</label>
<div class="flex items-center space-x-2">
<span class="text-xs font-medium text-gray-900">10 Sep 2024</span>
<!-- Calendar icon -->
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
</div>
</div>
</div>
<!-- Field: Account -->
<div>
<div class="relative flex items-center justify-between border border-gray-200 rounded-xl px-3.5 py-2.5 bg-white">
<label class="text-xs text-gray-500 font-medium">Account</label>
<div class="flex items-center space-x-1.5 pr-1">
<select class="text-xs font-medium text-gray-900 bg-transparent border-0 p-0 text-right focus:ring-0 cursor-pointer pr-4">
<option selected="">Bank BCA</option>
<option>Bank Mandiri</option>
<option>E-Wallet</option>
</select>
<svg class="w-3.5 h-3.5 text-gray-400 pointer-events-none absolute right-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<polyline points="6 9 12 15 18 9"></polyline>
</svg>
</div>
</div>
</div>
<!-- Field: Category -->
<div>
<div class="relative flex items-center justify-between border border-gray-200 rounded-xl px-3.5 py-2.5 bg-white">
<label class="text-xs text-gray-500 font-medium">Category</label>
<div class="flex items-center space-x-1.5 pr-1">
<select class="text-xs font-normal text-gray-400 bg-transparent border-0 p-0 text-right focus:ring-0 cursor-pointer pr-4">
<option disabled="" selected="">Pilih kategori</option>
<option class="text-gray-900">Makanan &amp; Minuman</option>
<option class="text-gray-900">Transportasi</option>
<option class="text-gray-900">Belanja</option>
</select>
<svg class="w-3.5 h-3.5 text-gray-400 pointer-events-none absolute right-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<polyline points="6 9 12 15 18 9"></polyline>
</svg>
</div>
</div>
</div>
<!-- Field: Budget (Optional) -->

<!-- Field: Notes (Optional) -->
<div>
<div class="flex items-center justify-between border border-gray-200 rounded-xl px-3.5 py-2 bg-white">
<label class="text-xs text-gray-500 font-medium whitespace-nowrap mr-2">Notes (Optional)</label>
<input class="w-full text-right text-xs text-gray-900 placeholder-gray-400 bg-transparent border-0 p-0 focus:ring-0 focus:outline-none" placeholder="Add notes..." type="text">
</div>
</div>
</div>
<!-- END: FormFields -->
</div>
<!-- BEGIN: ActionButton -->
<!-- Primary bottom submission CTA button -->
<div class="mt-6 pt-2" data-purpose="submit-action-container">
<button class="w-full py-3.5 px-4 bg-appDark hover:bg-black text-white text-sm font-semibold rounded-xl tracking-normal shadow transition-all duration-150 active:scale-[0.99] focus:outline-none" type="submit">
            Save Transaction
          </button>
</div>
<!-- END: ActionButton -->
</form>
<!-- END: TransactionForm -->
</div>
<!-- BEGIN: HomeIndicator -->
<!-- iOS bottom indicator bar -->
<footer class="w-full pb-2 pt-1 flex justify-center items-center" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-gray-300 rounded-full"></div>
</footer>
<!-- END: HomeIndicator -->
</main>
<!-- END: PhoneContainer -->


</body></html>
