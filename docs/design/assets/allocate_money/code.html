<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Allocate Money</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            ios: {
              bg: '#F8F9FA',
              card: '#FFFFFF',
              border: '#EDEDED',
              primaryText: '#1A1A1A',
              secondaryText: '#737373',
              iconBg: '#F3F4F6',
              iconDark: '#1E293B',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Native iOS smooth scrolling and tap highlight suppression */
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-[#F2F4F7] min-h-screen flex items-center justify-center p-0 sm:p-4 text-ios-primaryText antialiased font-sans">
<!-- BEGIN: MobileContainer -->
<!-- Constrained mobile iOS container mimicking screen 8 layout -->
<main class="w-full max-w-[390px] min-h-[844px] bg-white sm:rounded-[44px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-gray-100">
<!-- Top Section (Status Bar, Header, and Content) -->
<div class="flex-1 flex flex-col">
<!-- BEGIN: StatusBar -->
<!-- iOS Standard Status Bar -->
<header class="pt-3 px-7 pb-2 flex justify-between items-center text-black text-sm font-semibold tracking-tight" data-purpose="status-bar">
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<div class="flex items-center space-x-2 text-xs">
<!-- Cellular Signal Bars -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
<rect height="3" rx="0.8" width="3" x="0" y="9"></rect>
<rect height="6" rx="0.8" width="3" x="4.5" y="6"></rect>
<rect height="9" rx="0.8" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.8" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M8 9.6a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2zm-4.7-3a6.6 6.6 0 019.4 0 .8.8 0 001.1-1.1 8.2 8.2 0 00-11.6 0 .8.8 0 001.1 1.1zm-2.4-2.4a10 10 0 0114.2 0 .8.8 0 101.1-1.2 11.6 11.6 0 00-16.4 0 .8.8 0 001.1 1.2z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 rounded-[3.5px] border border-black p-[1px] flex items-center relative">
<div class="h-full w-full bg-black rounded-[2px]"></div>
<div class="absolute -right-[3.5px] top-1/2 -translate-y-1/2 w-[2px] h-[4px] bg-black rounded-r-[1px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<!-- Screen Title with standard close button -->
<nav class="relative flex items-center justify-between px-5 pt-3 pb-4" data-purpose="navigation-header">
<button aria-label="Close" class="w-9 h-9 flex items-center justify-center text-gray-800 hover:opacity-70 transition-opacity" type="button">
<!-- Close '✕' Icon -->
<svg class="w-5 h-5 stroke-[2.2] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 text-base font-semibold text-gray-900 tracking-tight">
          Allocate Money
        </h1>
<!-- Invisible placeholder to balance flex row layout -->
<div class="w-9 h-9"></div>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContent -->
<div class="px-5 pt-2 flex-1 flex flex-col"><!-- BEGIN: UnallocatedCard -->
<section aria-labelledby="unallocated-title" class="bg-white border border-[#E9EBEF] rounded-2xl p-4 mb-4 shadow-[0_1px_3px_rgba(0,0,0,0.03)]" data-purpose="unallocated-summary-card">
  <div class="flex items-center justify-between">
    <div class="flex items-center space-x-3.5">
      <div class="w-11 h-11 rounded-xl bg-[#F0F2F5] flex items-center justify-center flex-shrink-0 text-slate-700">
        <svg class="w-5 h-5 fill-none stroke-current stroke-[1.8]" viewBox="0 0 24 24">
          <rect height="16" rx="3" stroke-linecap="round" stroke-linejoin="round" width="20" x="2" y="4"></rect>
          <path d="M7 15h.01M17 12a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-xs font-normal text-gray-500 tracking-tight" id="unallocated-title">Total Unallocated</span>
        <span class="text-xl font-bold text-gray-900 tracking-tight mt-0.5">Rp10.000.000</span>
      </div>
    </div>
    <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full">Available</span>
  </div>
</section>
<!-- END: UnallocatedCard -->

<!-- BEGIN: Partial Allocation Input Step -->
<section class="bg-white border border-[#E9EBEF] rounded-2xl p-4 mb-4 shadow-[0_1px_3px_rgba(0,0,0,0.03)]" data-purpose="amount-input-step">
  <div class="flex items-center justify-between mb-2">
    <label for="allocate-amount-input" class="text-xs font-semibold text-gray-700 uppercase tracking-wider">Amount to Allocate</label>
    <span class="text-xs font-medium text-blue-600">Partial Allowed</span>
  </div>
  <div class="relative flex items-center mb-3">
    <div class="absolute left-3 text-lg font-bold text-gray-900 pointer-events-none">Rp</div>
    <input id="allocate-amount-input" type="text" value="4.000.000" class="w-full bg-[#F8FAFC] border border-gray-200 rounded-xl py-2.5 pl-11 pr-3 text-lg font-bold text-gray-900 focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
  </div>
  <!-- Quick Percentage Chips -->
  <div class="grid grid-cols-4 gap-2 mb-3">
    <button type="button" class="py-1.5 px-2 text-xs font-semibold rounded-lg border border-gray-200 bg-gray-50 text-gray-700 hover:bg-gray-100 active:scale-95 transition-all text-center">25%</button>
    <button type="button" class="py-1.5 px-2 text-xs font-semibold rounded-lg border border-black bg-black text-white active:scale-95 transition-all text-center">40%</button>
    <button type="button" class="py-1.5 px-2 text-xs font-semibold rounded-lg border border-gray-200 bg-gray-50 text-gray-700 hover:bg-gray-100 active:scale-95 transition-all text-center">50%</button>
    <button type="button" class="py-1.5 px-2 text-xs font-semibold rounded-lg border border-gray-200 bg-gray-50 text-gray-700 hover:bg-gray-100 active:scale-95 transition-all text-center">100%</button>
  </div>
  <!-- Calculation Readout -->
  <div class="flex items-center justify-between pt-2.5 border-t border-gray-100 text-xs">
    <span class="text-gray-500 font-normal">Remaining unallocated:</span>
    <span class="font-bold text-gray-800">Rp6.000.000</span>
  </div>
</section>
<!-- END: Partial Allocation Input Step -->

<!-- Section Instruction Heading -->
<div class="flex items-center justify-between mb-2.5">
  <h2 class="text-[14px] font-semibold text-gray-900 tracking-tight">
    Select Destination
  </h2>
  <span class="text-xs text-gray-500">1 destination per split</span>
</div>

<!-- BEGIN: Destination Selection Cards with Balances -->
<div class="flex flex-col space-y-2.5 mb-5" data-purpose="destination-options" role="radiogroup" aria-label="Allocation destination">
  <!-- Option 1: Flexible Money (Selected) -->
  <label class="w-full text-left bg-white border-2 border-black rounded-2xl p-3 flex items-center justify-between cursor-pointer transition-all shadow-[0_1px_3px_rgba(0,0,0,0.04)] relative">
    <input type="radio" name="destination" value="flexible" checked="" class="sr-only">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0 text-blue-600">
        <svg class="w-5 h-5 stroke-current stroke-[1.8] fill-none" viewBox="0 0 24 24">
          <path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center space-x-1.5">
          <span class="text-sm font-semibold text-gray-900 leading-tight">Flexible Money</span>
          <span class="text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-blue-100 text-blue-800">Selected</span>
        </div>
        <span class="text-xs text-gray-500 font-normal mt-0.5">For daily spending &amp; Safe to Spend</span>
        <div class="flex items-center space-x-1 text-xs mt-1">
          <span class="text-gray-400">Current: Rp2.500.000</span>
          <span class="text-gray-400">→</span>
          <span class="font-bold text-emerald-600">Rp6.500.000 (+Rp4M)</span>
        </div>
      </div>
    </div>
    <div class="w-5 h-5 rounded-full border-2 border-black flex items-center justify-center flex-shrink-0">
      <div class="w-2.5 h-2.5 rounded-full bg-black"></div>
    </div>
  </label>

  <!-- Option 2: Reserved Money -->
  <label class="w-full text-left bg-white border border-[#E9EBEF] rounded-2xl p-3 flex items-center justify-between hover:bg-gray-50 cursor-pointer transition-all shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
    <input type="radio" name="destination" value="reserved" class="sr-only">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center flex-shrink-0 text-purple-600">
        <svg class="w-5 h-5 stroke-current stroke-[1.8] fill-none" viewBox="0 0 24 24">
          <path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-semibold text-gray-900 leading-tight">Reserved Money</span>
        <span class="text-xs text-gray-500 font-normal mt-0.5">For specific obligations &amp; goals</span>
        <div class="flex items-center space-x-1 text-xs mt-1">
          <span class="text-gray-400">Current: Rp8.200.000</span>
          <span class="text-gray-400">→</span>
          <span class="font-medium text-gray-600">Rp12.200.000</span>
        </div>
      </div>
    </div>
    <div class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0"></div>
  </label>

  <!-- Option 3: Locked Money -->
  <label class="w-full text-left bg-white border border-[#E9EBEF] rounded-2xl p-3 flex items-center justify-between hover:bg-gray-50 cursor-pointer transition-all shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
    <input type="radio" name="destination" value="locked" class="sr-only">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0 text-slate-700">
        <svg class="w-5 h-5 stroke-current stroke-[1.8] fill-none" viewBox="0 0 24 24">
          <path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-semibold text-gray-900 leading-tight">Locked Money</span>
        <span class="text-xs text-gray-500 font-normal mt-0.5">For long term savings</span>
        <div class="flex items-center space-x-1 text-xs mt-1">
          <span class="text-gray-400">Current: Rp15.000.000</span>
          <span class="text-gray-400">→</span>
          <span class="font-medium text-gray-600">Rp19.000.000</span>
        </div>
      </div>
    </div>
    <div class="w-5 h-5 rounded-full border border-gray-300 flex items-center justify-center flex-shrink-0"></div>
  </label>
</div>
<!-- END: Destination Selection Cards -->

<!-- BEGIN: Confirm Allocation CTA -->
<div class="mt-auto pb-4 pt-2">
  <button type="button" class="w-full bg-black text-white font-semibold py-3.5 px-4 rounded-xl shadow-md hover:bg-gray-800 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
    <span class="">Confirm Allocation • Rp4.000.000</span>
    <svg class="w-4 h-4 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
      <path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </button>
  <p class="text-center text-[11px] text-gray-500 mt-2">Rp6.000.000 will stay in unallocated pool</p>
</div>
<!-- END: Confirm Allocation CTA --></div>
<!-- END: MainContent -->
</div>
<!-- BEGIN: HomeIndicator -->
<!-- Native iOS Bottom Home Bar Indicator -->
<footer class="w-full pb-2 flex justify-center items-center" data-purpose="home-indicator-container">
<div class="w-32 h-1 bg-black rounded-full mb-1"></div>
</footer>
<!-- END: HomeIndicator -->
</main>
<!-- END: MobileContainer -->


</body></html>
