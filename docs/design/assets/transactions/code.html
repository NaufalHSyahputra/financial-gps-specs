<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Transactions</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            appDark: '#121826',
            appGray: '#64748B',
            appLightGray: '#F1F5F9',
            appBorder: '#E2E8F0',
            incomeGreen: '#16A34A',
          }
        }
      }
    }
  </script>
<!-- Custom Stylesheet for fine-tuning layout and scroll behavior -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
    }
    /* Hide scrollbar for category pills container */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-slate-800">
<!-- BEGIN: MobileContainer -->

<main class="w-full max-w-[393px] h-[852px] bg-white relative flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[44px] border border-slate-100">
<!-- Top Content Area -->
<div class="flex-1 overflow-y-auto no-scrollbar pb-24">
<!-- BEGIN: StatusBar -->
<!-- Standard iOS Status Bar -->
<header class="pt-3 px-7 flex justify-between items-center text-slate-900 select-none" data-purpose="status-bar">
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<div class="flex items-center space-x-1.5">

</svg>

<div class="h-full w-full bg-slate-900 rounded-[1px]"></div>
</div>
</div>

<!-- END: StatusBar -->
<!-- BEGIN: ScreenHeader -->
<!-- Title and Notifications -->

<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">

</svg>
</button>
</section>
<!-- END: ScreenHeader -->
<!-- BEGIN: SearchBar -->
<section class="px-5 mb-4" data-purpose="search-box">
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400">
<svg class="w-4 h-4 stroke-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-[#f8fafc] text-sm text-slate-800 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-xl border border-slate-200/80 focus:outline-none focus:border-slate-400 focus:ring-0 transition" placeholder="Search transactions..." type="search"/>
</div>
</section>
<!-- END: SearchBar -->
<!-- BEGIN: FilterTabs -->
<!-- Category filters: All, Expense, Income, Transfer -->
<section class="px-5 mb-6 overflow-x-auto no-scrollbar" data-purpose="transaction-filters">
<div class="flex space-x-2 w-max">
<!-- Active Pill: All -->
<button class="bg-slate-900 text-white text-xs font-semibold px-4 py-1.5 rounded-full shadow-sm" type="button">
            All
          </button>
<!-- Inactive Pill: Expense -->
<button class="bg-[#f8fafc] border border-slate-200/90 text-slate-600 hover:bg-slate-100 text-xs font-medium px-4 py-1.5 rounded-full transition" type="button">
            Expense
          </button>
<!-- Inactive Pill: Income -->
<button class="bg-[#f8fafc] border border-slate-200/90 text-slate-600 hover:bg-slate-100 text-xs font-medium px-4 py-1.5 rounded-full transition" type="button">
            Income
          </button>
<!-- Inactive Pill: Transfer -->
<button class="bg-[#f8fafc] border border-slate-200/90 text-slate-600 hover:bg-slate-100 text-xs font-medium px-4 py-1.5 rounded-full transition" type="button">
            Transfer
          </button>
</div>
</section>
<!-- END: FilterTabs -->
<!-- BEGIN: TransactionsList -->
<div class="px-5 space-y-6" data-purpose="transactions-container">
<!-- Date Group 1: 10 Sep 2024 -->
<section data-purpose="date-group-1">
<h2 class="text-xs font-semibold text-slate-900 mb-2.5">10 Sep 2024</h2>
<div class="space-y-3.5">

<article class="flex items-center justify-between" data-purpose="transaction-item">

<div>

<p class="text-[11px] text-slate-500 font-medium">Makanan &amp; Minuman</p>
</div>
</div>
<span class="text-xs font-bold text-slate-900">-Rp85.000</span>
</article>

<div class="w-10 h-10 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-700 flex-shrink-0">

</svg>
</div>
<div>
<h3 class="text-xs font-bold text-slate-900">Transport</h3>
<p class="text-[11px] text-slate-500 font-medium">Transportasi</p>
</div>
</div>
<span class="text-xs font-bold text-slate-900">-Rp20.000</span>
</article>
<!-- Item 3: Salary (Income) -->
<article class="flex items-center justify-between" data-purpose="transaction-item">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-emerald-600 flex-shrink-0">

<path d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6H2.25m0 0v8.25m0 0a60.07 60.07 0 0015.797 2.101c.727.198 1.453-.342 1.453-1.096V6.75A.75.75 0 0018.75 6H18m-14.25 0a60.07 60.07 0 0115.797-2.101C20.274 3.701 21 4.241 21 4.995v.755" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12" cy="11.5" fill="none" r="2"></circle>
</svg>
</div>
<div>
<h3 class="text-xs font-bold text-slate-900">Salary</h3>
<p class="text-[11px] text-slate-500 font-medium">Gaji</p>
</div>
</div>
<span class="text-xs font-bold text-incomeGreen">+Rp10.000.000</span>
</article>
</div>
</section>
<!-- Date Group 2: 9 Sep 2024 -->
<section data-purpose="date-group-2">
<h2 class="text-xs font-semibold text-slate-900 mb-2.5">9 Sep 2024</h2>
<div class="space-y-3.5">
<!-- Item 4: Internet -->
<article class="flex items-center justify-between" data-purpose="transaction-item">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-700 flex-shrink-0">
<!-- WiFi / Bill Icon -->
<svg class="w-5 h-5 stroke-[1.6]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22h-.01" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<h3 class="text-xs font-bold text-slate-900">Internet</h3>
<p class="text-[11px] text-slate-500 font-medium">Tagihan</p>
</div>
</div>
<span class="text-xs font-bold text-slate-900">-Rp350.000</span>
</article>
</div>
</section>
</div>

<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Budget Tab -->
<a class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-700 transition" href="#">
<svg class="w-5 h-5 stroke-[1.7]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9m18 0V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

<svg class="w-5 h-5 stroke-[1.7]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Accounts</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</main>
<!-- END: MobileContainer -->
</body></html>
